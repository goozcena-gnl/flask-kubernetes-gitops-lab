apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: registry.example.com/devops/flask-k8s-lab
    newName: registry.gitlab.com/goozcena-gnl/test-lab
    digest: sha256:8e5256469386c9aa526f4f6f201ea822b900e098ba5c84d023dd6e6756b006fb

patches:
  - path: deployment-patch.yaml
  - path: ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: flask-k8s-lab
      namespace: flask-k8s-lab
