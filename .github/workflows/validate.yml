name: Validation

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes
          --requirement app/requirements-dev.lock

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5.1.0
        with:
          version: v1.35.1

      - name: Install Hadolint
        run: |
          HADOLINT_VERSION="v2.15.1"
          HADOLINT_SHA256="c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
          curl -fsSL \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            -o /tmp/hadolint
          printf '%s  %s\n' "$HADOLINT_SHA256" /tmp/hadolint | sha256sum --check
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="v0.8.0"
          KUBECONFORM_SHA256="9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
          KUBECONFORM_BASE="https://github.com/yannh/kubeconform/releases/download"
          curl -fsSL \
            "${KUBECONFORM_BASE}/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o /tmp/kubeconform.tar.gz
          printf '%s  %s\n' "$KUBECONFORM_SHA256" /tmp/kubeconform.tar.gz | sha256sum --check
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          chmod +x /usr/local/bin/kubeconform

      - name: Flask tests
        run: |
          python scripts/lock-requirements.py --check
          python scripts/check-supply-chain.py
          python -m compileall -q app scripts
          python -m pytest -q

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff formatting check
        run: python -m ruff format --check .

      - name: YAML lint
        run: python -m yamllint -c .yamllint.yaml .

      - name: YAML parsing
        run: python scripts/check-yaml.py

      - name: Markdown-link validation
        run: python scripts/check-markdown-links.py

      - name: Fallback secret scan
        run: python scripts/scan-secrets.py

      - name: Docker image build
        run: docker build --platform linux/amd64 -t flask-k8s-lab:ci .

      - name: Read-only container smoke test
        run: |
          set -eu
          docker rm -f flask-smoke >/dev/null 2>&1 || true
          docker run -d --name flask-smoke --read-only --tmpfs /tmp -p 8080:8080 flask-k8s-lab:ci
          cleanup() {
            docker logs flask-smoke || true
            docker rm -f flask-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          i=0
          while [ "$i" -lt 45 ]; do
            s=$(docker inspect -f '{{.State.Health.Status}}' flask-smoke 2>/dev/null || true)
            [ "$s" = "healthy" ] && break
            sleep 2
            i=$((i + 1))
          done

          curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz >/dev/null

      - name: Kustomize rendering and image contract
        run: |
          kubectl kustomize deploy/kubernetes/base > /tmp/base-rendered.yaml
          kubectl kustomize deploy/kubernetes/overlays/minikube \
            > /tmp/minikube-rendered.yaml
          python scripts/check-rendered-image.py

      - name: Hadolint
        run: hadolint --failure-threshold error Dockerfile

      - name: kubeconform
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version 1.35.1 \
            /tmp/base-rendered.yaml \
            /tmp/minikube-rendered.yaml
