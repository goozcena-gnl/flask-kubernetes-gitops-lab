<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Flask GitOps delivery architecture and evidence</title><desc id="desc">GitLab CI validates and builds an immutable OCI image, Git records desired state, and Argo CD alone reconciles Kubernetes.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#092a2b"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#34d399"/></marker></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="52" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="29" font-weight="800">IMMUTABLE OCI DELIVERY · GITOPS TRUST BOUNDARY</text>
  <text x="52" y="87" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">The pipeline publishes an image; Argo CD is the sole cluster reconciler.</text>
  <g transform="translate(52 130)" font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="14" font-weight="800">
      <rect x="0" y="40" width="130" height="70" rx="14" fill="#0f2730" stroke="#34d399"/><text x="65" y="72" fill="#d1fae5">SOURCE</text><text x="65" y="94" fill="#6ee7b7" font-size="12">commit</text>
      <rect x="168" y="40" width="150" height="70" rx="14" fill="#0f2730" stroke="#34d399"/><text x="243" y="72" fill="#d1fae5">GITLAB CI</text><text x="243" y="94" fill="#6ee7b7" font-size="12">tests + Buildah</text>
      <rect x="356" y="40" width="150" height="70" rx="14" fill="#0f2730" stroke="#34d399"/><text x="431" y="72" fill="#d1fae5">OCI IMAGE</text><text x="431" y="94" fill="#6ee7b7" font-size="12">full commit tag</text>
      <rect x="544" y="40" width="144" height="70" rx="14" fill="#0f2730" stroke="#34d399"/><text x="616" y="72" fill="#d1fae5">REGISTRY</text><text x="616" y="94" fill="#6ee7b7" font-size="12">handoff</text>
      <rect x="726" y="40" width="160" height="70" rx="14" fill="#122638" stroke="#38bdf8"/><text x="806" y="72" fill="#e0f2fe">GIT STATE</text><text x="806" y="94" fill="#7dd3fc" font-size="12">reviewed image ref</text>
      <rect x="924" y="40" width="150" height="70" rx="14" fill="#19233a" stroke="#a78bfa"/><text x="999" y="72" fill="#ede9fe">ARGO CD</text><text x="999" y="94" fill="#c4b5fd" font-size="12">reconciler</text>
    </g>
    <path d="M130 75h38M318 75h38M506 75h38M688 75h38M886 75h38" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M999 110v74" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="854" y="192" width="290" height="118" rx="20" fill="#101d31" stroke="#a78bfa" stroke-width="2"/>
    <text x="999" y="228" fill="#ede9fe" font-size="17" font-weight="800">KUBERNETES / MINIKUBE</text><g font-size="13" font-weight="700"><rect x="882" y="252" width="92" height="30" rx="15" fill="#312e81"/><text x="928" y="272" fill="#ddd6fe">WORKLOAD</text><rect x="986" y="252" width="130" height="30" rx="15" fill="#312e81"/><text x="1051" y="272" fill="#ddd6fe">HEALTH PROBES</text></g>
    <rect x="0" y="152" width="688" height="158" rx="18" fill="#251416" fill-opacity=".7" stroke="#fb7185" stroke-width="2" stroke-dasharray="9 7"/>
    <text x="24" y="184" text-anchor="start" fill="#fda4af" font-size="14" font-weight="800" letter-spacing="1">PIPELINE LIMIT</text>
    <text x="24" y="218" text-anchor="start" fill="#fecdd3" font-size="20" font-weight="800">NO CI → KUBERNETES DEPLOYMENT</text>
    <text x="24" y="248" text-anchor="start" fill="#cbd5e1" font-size="15">No deploy stage · no kubeconfig · no cluster credentials</text>
    <text x="24" y="280" text-anchor="start" fill="#94a3b8" font-size="13">Image promotion is a reviewed Git change; registry access is a separate handoff.</text>
  </g>
  <g transform="translate(52 482)" font-family="Arial, sans-serif"><text x="0" y="0" fill="#6ee7b7" font-size="14" font-weight="800" letter-spacing="1">RETAINED MINIKUBE VALIDATION</text><g font-size="13" font-weight="700"><rect x="0" y="22" width="145" height="34" rx="17" fill="#064e3b"/><text x="28" y="44" fill="#d1fae5">SYNCED / HEALTHY</text><rect x="160" y="22" width="143" height="34" rx="17" fill="#064e3b"/><text x="191" y="44" fill="#d1fae5">ENDPOINT CHECKS</text><rect x="318" y="22" width="116" height="34" rx="17" fill="#064e3b"/><text x="350" y="44" fill="#d1fae5">SELF-HEAL</text><rect x="449" y="22" width="90" height="34" rx="17" fill="#064e3b"/><text x="479" y="44" fill="#d1fae5">PRUNE</text></g></g>
  <text x="52" y="593" fill="#64748b" font-family="Arial, sans-serif" font-size="12">ARCHITECTURE DERIVED FROM REPOSITORY DESIGN · CALLOUTS LIMITED TO RETAINED E2E VALIDATION</text>
</svg>
